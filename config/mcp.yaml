# Google Workspace MCP server and the mapping from our operations to its tools (architecture §6, Task 5.1).
# Chosen server (user, 2026-10-22): the user's own gmail-gdocs-mcp, hosted on Render over Streamable HTTP
# (github.com/Bhavya-Chadha-256/Milestone-3---MCP-Testing). It holds the Google OAuth tokens itself; this
# file holds no secrets. `auth_token_env` names the .env variable sent as the bearer token.
#
# The server can only append to an existing Doc and send mail, so `pulse` appends each week's pulse once to
# one running Doc (`delivery.doc_id` in config/pulse.yaml) and makes no Gmail draft: there is no draft tool,
# and its send tool is never mapped (DEL-15, DEL-16). A server with create/read/draft tools maps
# create_doc, update_doc, read_doc and create_draft instead (see architecture.md §6.2).
server:
  transport: streamable_http
  url: https://milestone-3-mcp-testing.onrender.com/mcp
  auth_token_env: MCP_AUTH_TOKEN
  timeout_seconds: 120  # Render's free tier sleeps when idle; the first request can take about a minute
operations:
  append_doc:
    tool: gdocs_append_text
    args: {document: "{doc_id}", text: "{body}"}
    requires_id: true
    id_regex: '"document_id":\s*"([^"]+)"'
    url_regex: '"document_url":\s*"([^"]+)"'
  auth_status:
    tool: google_auth_status
    args: {}
allowlist: [append_doc, auth_status]
