# All tunables for the Groww Weekly Review Pulse (architecture.md §10).
product:
  name: Groww
  play_package: com.nextbillion.groww
  app_store_id: "1404871703"          # verified via iTunes Search API, 2026-10-21
  storefront: in
window:
  weeks: 12                              # 8–12
  timezone: Asia/Kolkata
sources:
  file:       { enabled: true }
  app_store:  { enabled: true }         # used by `pulse fetch app-store`
  play_store: { enabled: true, max_reviews: 20000, lang: en }   # `pulse fetch play-store` (google-play-scraper, architecture §3.1)
themes:
  min: 3
  max: 5
  top_n: 3
  name_max_words: 4
  min_reviews: 100
  discovery_sample: 400
  discovery_batch: 100                   # max reviews per discovery pass (passes also fit the per-minute token limit)
  rediscover_unthemed_threshold: 0.20    # applies to the actionable unthemed share (architecture §3.3)
  trend_z: 2.0                           # trend arrow only at ≥ 2 standard errors (architecture §3.5)
  seed_hints: [customer support, app bugs and performance, charges and brokerage, trading and F&O orders,
               charts and market data, KYC and onboarding, payments and withdrawals, mutual funds and SIP]
llm:
  provider: groq                         # Groq free tier (architecture §5.1); key in .env as GROQ_API_KEY
  model: openai/gpt-oss-120b
  api_key_env: GROQ_API_KEY
  classify_chunk_size: 50
  limits: { rpm: 30, tpm: 8000, rpd: 1000, tpd: 200000 }   # per model; confirmed tpm/rpd from response headers 2026-10-22
  daily_token_reserve: 20000             # kept back from classification for quotes and compose
  stages:                                # effort = reasoning_effort (gpt-oss only); max_tokens = max_completion_tokens
    discover: { effort: medium, max_tokens: 3000 }
    classify: { effort: low,    max_tokens: 2500 }
    quotes:   { effort: medium, max_tokens: 2000 }
    compose:  { effort: high,   max_tokens: 3000 }
    judge:    { effort: low,    max_tokens: 1000 }
  pricing: { input: 0.0, output: 0.0 }   # USD per million tokens; 0 on the free tier
pulse:
  max_words: 250
  quotes: 3
  actions: 3
  summary_max_words: 18
  action_max_words: 20
  quote_max_words: 30
  rationale_max_words: 25
  quote_min_words: 8
  quote_pool_max_words: 60
  quote_candidates: 30
  evidence_per_theme: 20
  retries: 2
  min_theme_reviews: 10
monitoring:
  duplicate_share_warn: 0.10
  volume_change_warn: 0.5
  skipped_share_warn: 0.05
  unclassified_warn: 0.01
  cost_spike_factor: 2.0
  retries_warn: 1
  daily_tokens_warn: 0.80                # M-COST-2
  broad_theme_warn: 0.40                 # M-DATA-6: a theme above this share is a likely catch-all
evals:
  judge_model: qwen/qwen3.8-27b          # a different family from the pipeline model (architecture §9)
  judge_majority_flip_rate: 0.05
delivery:
  drive_folder_id: <FOLDER_ID>      # servers that create a Doc per week (create_doc)
  doc_id: <DOC_ID>                  # append-only servers (append_doc): the one running Doc, created by hand
  recipient: <self-or-alias@example.com>
  doc_title: "Groww Review Pulse — {iso_week} ({range})"
ingest:
  min_words: 8                           # shorter reviews are stored but excluded from themes
  languages: [en, hinglish]              # others (hi, other) are stored but excluded from themes
privacy:
  extra_patterns: []                     # Groww client-code / order-ID formats; fill before first real run
retention:
  raw_days: 14
dashboard:                               # pulse serve (Phase 7): local only
  host: 127.0.0.1                        # must be a loopback address
  port: 8787
  page_size: 50
  max_page_size: 200
  allow_export: true
  export_max_rows: 5000
paths: { db: data/pulse.db, runs: runs, raw: data/raw, mappings: config/mappings }
